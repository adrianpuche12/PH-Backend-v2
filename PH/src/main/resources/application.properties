spring.application.name=balance-service-v2

# Puerto — Railway inyecta PORT dinámico; localmente usa 8080
server.port=${PORT:8080}

# Perfil activo por defecto. En Docker se sobreescribe con SPRING_PROFILES_ACTIVE=prod
spring.profiles.active=local

# DataSource - usa variables de entorno si existen, sino usa NeonDB DEV como default local
spring.datasource.url=${DB_URL:jdbc:postgresql://ep-red-water-ac3dna23-pooler.sa-east-1.aws.neon.tech/neondb?sslmode=require}
spring.datasource.username=${DB_USER:neondb_owner}
spring.datasource.password=${DB_PASSWORD:npg_jYfKb0RcnV8P}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway — controla el schema; en DBs existentes baseline-on-migrate marca V1 como ya aplicado
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Eureka deshabilitado
eureka.client.enabled=false

# Keycloak Admin API
keycloak.admin.url=${KEYCLOAK_URL:https://keycloak.belopia.app}
keycloak.admin.realm=${KEYCLOAK_REALM:proyecto-h-dev}
keycloak.admin.username=${KEYCLOAK_ADMIN_USER:kc-admin}
keycloak.admin.password=${KEYCLOAK_ADMIN_PASSWORD:GeronimoAdmin2024!}

# Cloudflare R2
r2.account-id=${R2_ACCOUNT_ID}
r2.access-key=${R2_ACCESS_KEY_ID}
r2.secret-key=${R2_SECRET_ACCESS_KEY}
r2.bucket=${R2_BUCKET_NAME}
r2.endpoint=${R2_ENDPOINT}
r2.public-url=${R2_PUBLIC_URL}
r2.folder-prefix=${R2_FOLDER_PREFIX:local}

# Multipart
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Swagger / OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Logging
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.cors=DEBUG
logging.level.org.springframework.web.filter=DEBUG
