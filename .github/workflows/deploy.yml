name: Build & Deploy Backend

on:
  push:
    branches: [main, master, develop]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Determinar ambiente
        id: env
        run: |
          if [ "${{ github.ref_name }}" = "main" ] || [ "${{ github.ref_name }}" = "master" ]; then
            echo "IMAGE_TAG=latest" >> $GITHUB_OUTPUT
            echo "RAILWAY_SERVICE_ID=${{ secrets.RAILWAY_SERVICE_ID_PROD }}" >> $GITHUB_OUTPUT
            echo "RAILWAY_ENVIRONMENT_ID=${{ secrets.RAILWAY_ENVIRONMENT_ID_PROD }}" >> $GITHUB_OUTPUT
          else
            echo "IMAGE_TAG=dev-latest" >> $GITHUB_OUTPUT
            echo "RAILWAY_SERVICE_ID=${{ secrets.RAILWAY_SERVICE_ID_DEV }}" >> $GITHUB_OUTPUT
            echo "RAILWAY_ENVIRONMENT_ID=${{ secrets.RAILWAY_ENVIRONMENT_ID_DEV }}" >> $GITHUB_OUTPUT
          fi

      - name: Login a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build y push imagen Docker
        uses: docker/build-push-action@v5
        with:
          context: ./PH
          push: true
          tags: |
            adrianpuche/humberto-v2-backend:${{ steps.env.outputs.IMAGE_TAG }}

      - name: Deploy en Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          SERVICE_ID: ${{ steps.env.outputs.RAILWAY_SERVICE_ID }}
          ENV_ID: ${{ steps.env.outputs.RAILWAY_ENVIRONMENT_ID }}
        run: |
          DEPLOYMENT_ID=$(curl -sf -X POST "https://backboard.railway.app/graphql/v2" \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"query\": \"{ deployments(input: { serviceId: \\\"$SERVICE_ID\\\", environmentId: \\\"$ENV_ID\\\" }) { edges { node { id status } } } }\"}" \
            | jq -r '.data.deployments.edges[0].node.id')
          echo "Redeploying deployment: $DEPLOYMENT_ID"
          curl -sf -X POST "https://backboard.railway.app/graphql/v2" \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"query\": \"mutation { deploymentRedeploy(id: \\\"$DEPLOYMENT_ID\\\") { id status } }\"}"
