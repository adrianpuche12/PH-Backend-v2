# Configuración PRODUCCIÓN v2 — NeonDB (PostgreSQL)

# NeonDB connection (variables de entorno en producción)
# Formato: jdbc:postgresql://[host].neon.tech/[database]?sslmode=require
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# ADVERTENCIA: cambiar a 'validate' cuando el schema esté estabilizado (requiere Flyway)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Keycloak Admin API
keycloak.admin.url=${KEYCLOAK_URL:http://62.171.160.238:8095}
keycloak.admin.realm=${KEYCLOAK_REALM:proyecto-h-prod}
keycloak.admin.username=${KEYCLOAK_ADMIN_USER:admin}
keycloak.admin.password=${KEYCLOAK_ADMIN_PASSWORD:GeronimoAdmin2024!}

# Spring Security — JWT Keycloak (PROD realm)
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_URL:http://62.171.160.238:8095}/realms/${KEYCLOAK_REALM:proyecto-h-prod}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_URL:http://62.171.160.238:8095}/realms/${KEYCLOAK_REALM:proyecto-h-prod}/protocol/openid-connect/certs

# Logging producción
logging.level.org.springframework.web=INFO
logging.level.org.springframework.web.cors=INFO
logging.level.org.springframework.web.filter=INFO
logging.level.root=INFO
