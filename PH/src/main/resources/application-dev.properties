# Configuración DESARROLLO v2 — NeonDB (PostgreSQL)

# Formato: jdbc:postgresql://[host].neon.tech/[database]?sslmode=require
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Spring Security — JWT Keycloak (DEV realm)
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_URL:http://62.171.160.238:8095}/realms/${KEYCLOAK_REALM:proyecto-h-dev}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_URL:http://62.171.160.238:8095}/realms/${KEYCLOAK_REALM:proyecto-h-dev}/protocol/openid-connect/certs

logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.cors=DEBUG
logging.level.org.springframework.web.filter=DEBUG
logging.level.org.springframework.jdbc=DEBUG
logging.level.org.hibernate=DEBUG
logging.level.root=DEBUG