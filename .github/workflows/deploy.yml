name: Build & Deploy Backend

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Ejecutar tests unitarios
        working-directory: ./PH
        run: mvn clean test -Dtest="*Test" -DfailIfNoTests=false -B
        env:
          DB_URL: ${{ secrets.DB_URL_DEV }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Determinar ambiente
        id: env
        run: |
          if [ "${{ github.ref_name }}" = "main" ] || [ "${{ github.ref_name }}" = "master" ]; then
            echo "IMAGE_TAG=latest" >> $GITHUB_OUTPUT
            echo "RAILWAY_SERVICE_ID=${{ secrets.RAILWAY_SERVICE_ID_PROD }}" >> $GITHUB_OUTPUT
            echo "RAILWAY_ENVIRONMENT_ID=${{ secrets.RAILWAY_ENVIRONMENT_ID_PROD }}" >> $GITHUB_OUTPUT
          else
            echo "IMAGE_TAG=dev-latest" >> $GITHUB_OUTPUT
            echo "RAILWAY_SERVICE_ID=${{ secrets.RAILWAY_SERVICE_ID_DEV }}" >> $GITHUB_OUTPUT
            echo "RAILWAY_ENVIRONMENT_ID=${{ secrets.RAILWAY_ENVIRONMENT_ID_DEV }}" >> $GITHUB_OUTPUT
          fi

      - name: Login a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build y push imagen Docker
        uses: docker/build-push-action@v5
        with:
          context: ./PH
          push: true
          tags: |
            adrianpuche/humberto-v2-backend:${{ steps.env.outputs.IMAGE_TAG }}
            adrianpuche/humberto-v2-backend:${{ github.sha }}

      - name: Deploy en Railway (actualizar imagen + redeploy)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          SERVICE_ID: ${{ steps.env.outputs.RAILWAY_SERVICE_ID }}
          ENV_ID: ${{ steps.env.outputs.RAILWAY_ENVIRONMENT_ID }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          FULL_IMAGE="adrianpuche/humberto-v2-backend:$IMAGE_TAG"
          echo "Updating Railway service source image to: $FULL_IMAGE"

          # Step 1: Actualizar la imagen fuente del servicio en Railway
          UPDATE_RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "https://backboard.railway.app/graphql/v2" \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"query\": \"mutation { serviceInstanceUpdate(serviceId: \\\"$SERVICE_ID\\\", environmentId: \\\"$ENV_ID\\\", input: { source: { image: \\\"$FULL_IMAGE\\\" } }) }\"}")
          echo "Update response: $UPDATE_RESPONSE"
          if echo "$UPDATE_RESPONSE" | grep -q '"errors"'; then
            echo "ERROR: Railway serviceInstanceUpdate devolvió errores"
            exit 1
          fi

          # Step 2: Disparar un nuevo deploy con la imagen actualizada
          REDEPLOY_RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "https://backboard.railway.app/graphql/v2" \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"query\": \"mutation { serviceInstanceRedeploy(serviceId: \\\"$SERVICE_ID\\\", environmentId: \\\"$ENV_ID\\\") }\"}")
          echo "Redeploy response: $REDEPLOY_RESPONSE"
          if echo "$REDEPLOY_RESPONSE" | grep -q '"errors"'; then
            echo "ERROR: Railway serviceInstanceRedeploy devolvió errores"
            exit 1
          fi
          echo "Deploy a Railway completado exitosamente"
