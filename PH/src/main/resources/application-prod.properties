# Configuración PRODUCCIÓN v2 — NeonDB (PostgreSQL)

# NeonDB connection (variables de entorno en producción)
# Formato: jdbc:postgresql://[host].neon.tech/[database]?sslmode=require
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP — permite que NeonDB escale a cero cuando no hay actividad
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.keepalive-time=0

# JPA / Hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# PRODUCCIÓN: validate — Flyway controla el schema; Hibernate solo verifica que coincida
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Keycloak Admin API
keycloak.admin.url=${KEYCLOAK_URL:https://keycloak.belopia.app}
keycloak.admin.realm=${KEYCLOAK_REALM:proyecto-h-prod}
keycloak.admin.username=${KEYCLOAK_ADMIN_USER:admin}
keycloak.admin.password=${KEYCLOAK_ADMIN_PASSWORD:GeronimoAdmin2024!}


# Logging producción
logging.level.org.springframework.web=INFO
logging.level.org.springframework.web.cors=INFO
logging.level.org.springframework.web.filter=INFO
logging.level.root=INFO
