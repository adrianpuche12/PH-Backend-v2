name: Keepalive — Railway services

on:
  schedule:
    - cron: '*/10 * * * *'   # cada 10 minutos
  workflow_dispatch:           # permite ejecutar manualmente

jobs:
  ping:
    name: Ping Railway services
    runs-on: ubuntu-latest
    steps:
      # Ping backend DEV deshabilitado (2026-07-07) — Fase 1 del plan de reduccion de costos Neon/Railway.
      # Ver: 01. INFRAESTRUCTURA/05. Cambio Keepalive - Plan de Rollback.md para restaurar.

      - name: Ping backend PROD
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            "${{ secrets.RAILWAY_PROD_URL }}/api/v2/stores/active" 2>/dev/null || echo "0")
          echo "Backend PROD: HTTP $STATUS"

      # Ping Keycloak eliminado (2026-07-18) — keycloak.belopia.app dado de baja (Belopia suspendido).
