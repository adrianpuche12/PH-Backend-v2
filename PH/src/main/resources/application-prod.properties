# Configuración PRODUCCIÓN v2 — NeonDB (PostgreSQL)

# NeonDB connection (variables de entorno en producción)
# Formato: jdbc:postgresql://[host].neon.tech/[database]?sslmode=require
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# PRODUCCIÓN: validate — Hibernate verifica el schema pero NUNCA modifica tablas ni borra datos
# Si hay diferencia entre entidades y BD, la app falla al arrancar con error claro (seguro)
# Para cambios de schema en PROD: ejecutar SQL manual o usar Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Keycloak Admin API
keycloak.admin.url=${KEYCLOAK_URL:http://62.171.160.238:8095}
keycloak.admin.realm=${KEYCLOAK_REALM:proyecto-h-prod}
keycloak.admin.username=${KEYCLOAK_ADMIN_USER:admin}
keycloak.admin.password=${KEYCLOAK_ADMIN_PASSWORD:GeronimoAdmin2024!}


# Logging producción
logging.level.org.springframework.web=INFO
logging.level.org.springframework.web.cors=INFO
logging.level.org.springframework.web.filter=INFO
logging.level.root=INFO
